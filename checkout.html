<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout | FoodHub</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/checkout.css">

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

<div class="container">

<a href="index.html" class="navbar-brand">

🍔 FoodHub

</a>

</div>

</nav>

<div class="container mt-5">

<div class="row">

<!-- Address Form -->

<div class="col-lg-7">

<h3>Delivery Address</h3>

<form id="checkoutForm">

<div class="mb-3">

<label>Name</label>

<input
type="text"
class="form-control"
id="name"
required>

</div>

<div class="mb-3">

<label>Phone Number</label>

<input
type="tel"
class="form-control"
id="phone"
required>

</div>

<div class="mb-3">

<label>Address</label>

<textarea
class="form-control"
id="address"
rows="3"
required></textarea>

</div>

<div class="mb-3">

<label>City</label>

<input
type="text"
class="form-control"
id="city"
required>

</div>

<div class="mb-3">

<label>Pincode</label>

<input
type="text"
class="form-control"
id="pincode"
required>

</div>

<div class="mb-3">

<label>Select Delivery Time</label>

<select class="form-select" id="deliveryTime">

<option>30 Minutes</option>

<option>45 Minutes</option>

<option>60 Minutes</option>

</select>

</div>

<div class="mb-3">

<label>Payment Method</label>

<select class="form-select" id="paymentMethod">

<option>Cash on Delivery</option>

<option>UPI</option>

<option>Credit Card</option>

<option>Debit Card</option>

</select>

</div>

</form>

</div>

<!-- Order Summary -->

<div class="col-lg-5">

<div class="card shadow p-4">

<h3>Order Summary</h3>

<hr>

<div id="summaryItems"></div>

<hr>

<h5>

Subtotal :
<span id="subtotal">$0</span>

</h5>

<h5>

GST (5%) :
<span id="gst">$0</span>

</h5>

<h5>

Delivery :
<span>$5</span>

</h5>

<h3 class="text-warning">

Grand Total :
<span id="grand">$0</span>

</h3>

<button
class="btn btn-warning w-100 mt-3"
onclick="placeOrder()">

Proceed To Payment

</button>

</div>

</div>

</div>

</div>

<script src="js/checkout.js"></script>

</body>

</html>
